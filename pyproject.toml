[project]
name = "llm-chat-interface"
version = "0.1.0"
description = "Multi-user ChatGPT-style web app in front of a local llama.cpp server (Ornithopter 35B)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "pyjwt>=2.9",
    "bcrypt>=4.1",
    "slowapi>=0.1.9",
    "pypdf>=6.17.0",
    "python-docx>=1.2.0",
    "pillow>=12.3.0",
    "filetype>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "respx>=0.21",
    "asgi-lifespan>=2.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["backend"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# The load tool must count *any* failure (transport, timeout, decode) as an error.
"scripts/load_test.py" = ["BLE001"]
# Attachment extraction/derivatives are best-effort — never fail the upload.
"backend/app/services/attachments.py" = ["BLE001"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's `Depends()` in argument defaults is the framework idiom and is safe.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File"]

